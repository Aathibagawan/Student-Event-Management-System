# One command local setup:  docker compose up --build
# API -> http://localhost:8000/api/docs/    (run the React app separately: cd frontend && npm run dev)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ace_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ace_events"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      DJANGO_DEBUG: "True"            # local only
      DJANGO_SECRET_KEY: docker-dev-secret-key-change-me-please-0123456789
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ace_events
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      SERVE_MEDIA: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
